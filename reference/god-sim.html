<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Пісочниця Творця</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bar: #2b2e27; --panel: #3e4238; --panel-dark: #2a2d25; --edge: #161813;
    --hi: #5b604f; --ink: #f1efe4; --ink-dim: #b9b8a6;
    --active: #c9402b; --active-hi: #ff6a4d; --active-lo: #7e2416; --sea: #122c66;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bar: #2b2e27; --ink: #f1efe4; } }
  :root[data-theme="dark"] { --bar: #2b2e27; --ink: #f1efe4; }
  html, body {
    height: 100%; margin: 0; background: var(--bar); color: var(--ink);
    font-family: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 8px; background: var(--bar); border-bottom: 3px solid var(--edge); flex-shrink: 0;
  }
  h1 { font-size: 9px; margin: 0; line-height: 1.6; text-shadow: 2px 2px 0 #000; }
  .hbtns { display: flex; gap: 5px; }
  .hbtn {
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    background: var(--panel); color: var(--ink); font-family: inherit; font-size: 11px;
    border: 2px solid var(--edge);
    box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--panel-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .hbtn.on { background: var(--active); box-shadow: inset 2px 2px 0 var(--active-hi), inset -2px -2px 0 var(--active-lo); }
  #canvasWrap { flex: 1; position: relative; min-height: 0; background: var(--sea); overflow: hidden; }
  canvas#world { position: absolute; top: 0; left: 0; touch-action: none; display: block; }
  #toast {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: rgba(18,20,16,.88); border: 2px solid var(--edge);
    padding: 7px 10px; font-size: 7px; line-height: 1.7; color: var(--ink);
    pointer-events: none; white-space: nowrap; transition: opacity .4s; opacity: 0;
  }
  #hud {
    position: absolute; left: 8px; bottom: 8px; display: flex; gap: 10px; align-items: center;
    background: rgba(18,20,16,.82); border: 2px solid var(--edge); padding: 6px 9px;
    font-size: 7px; pointer-events: none;
  }
  #windArrow { display: inline-block; font-size: 10px; line-height: 1; transition: transform .6s; }
  footer { background: var(--panel); border-top: 3px solid var(--edge); padding: 6px 6px 8px; flex-shrink: 0; }
  .tabs { display: flex; gap: 4px; max-width: 560px; margin: 0 auto 6px; }
  .tab {
    flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; justify-content: center; gap: 4px;
    background: var(--panel-dark); color: var(--ink-dim); font-family: inherit; font-size: 6px; cursor: pointer;
    border: 2px solid var(--edge); box-shadow: inset 2px 2px 0 #4b4f42, inset -2px -2px 0 #1d1f19; padding: 0 2px;
  }
  .tab canvas { width: 20px; height: 20px; image-rendering: pixelated; }
  #insp { position: absolute; left: 8px; top: 46px; display: none; background: rgba(18,20,16,.9); border: 2px solid var(--edge); padding: 8px 10px; font-size: 7px; line-height: 2; max-width: 62%; pointer-events: none; }
  #insp b { color: #ffe45c; font-weight: normal; }
  .bar { display: inline-block; width: 64px; height: 6px; background: #1a1a18; border: 1px solid #000; vertical-align: middle; margin-left: 6px; }
  .bar i { display: block; height: 100%; }
  .tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-width: 560px; margin: 0 auto; }
  .tool {
    background: var(--panel-dark); color: var(--ink-dim); font-family: inherit; cursor: pointer;
    border: 2px solid var(--edge);
    box-shadow: inset 2px 2px 0 #4b4f42, inset -2px -2px 0 #1d1f19;
    padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .tool canvas { width: 28px; height: 28px; image-rendering: pixelated; }
  .tool span { font-size: 7px; }
  .tool.active, .tab.active { background: var(--active); color: #fff; box-shadow: inset 2px 2px 0 var(--active-hi), inset -2px -2px 0 var(--active-lo); }
  .tool:focus-visible, .hbtn:focus-visible, .tab:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ПІСОЧНИЦЯ<br>ТВОРЦЯ</h1>
    <div class="hbtns">
      <button class="hbtn" id="panBtn" title="Рухати карту">✋</button>
      <button class="hbtn" id="brushBtn" title="Розмір пензля">M</button>
      <button class="hbtn on" id="dayBtn" title="День і ніч">☀</button>
      <button class="hbtn" id="soundBtn" title="Звук">🔊</button>
      <button class="hbtn" id="pauseBtn" title="Пауза">❚❚</button>
      <button class="hbtn" id="regenBtn" title="Новий світ">↻</button>
    </div>
  </header>
  <div id="canvasWrap">
    <canvas id="world"></canvas>
    <div id="toast"></div>
    <div id="insp"></div>
    <div id="hud"><span id="timeLbl">☀ 12:00</span><span>Вітер <span id="windArrow">➤</span></span><span id="animalLbl">🐾 0</span></div>
  </div>
  <footer>
    <div class="tabs" id="tabs"></div>
    <div class="tools" id="toolbar"></div>
  </footer>
</div>

<script>
(function () {
  const wrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const toastEl = document.getElementById('toast');
  const timeLbl = document.getElementById('timeLbl');
  const windArrow = document.getElementById('windArrow');
  const animalLbl = document.getElementById('animalLbl');

  // ================= constants =================
  const SUB = 6;
  const K = SUB / 4;
  const DEEP = 0.27, SEA = 0.36, SAND = 0.395, GRASS = 0.60, HILL = 0.70, ROCK = 0.86;
  const C_NONE = 0, C_TREE = 1, C_FIRE = 2, C_BURNT = 3, C_ICE = 4, C_LAVA = 5, C_BASALT = 6;
  const B_TEMP = 0, B_TUNDRA = 1, B_DESERT = 2, B_SAVANNA = 3, B_JUNGLE = 4, B_SWAMP = 5;
  const GROW = [0.0008, 0.0004, 0.00015, 0.0003, 0.002, 0.0008];
  const TICK = 150;

  let W, H, N, hgt, cover, timer, wet, vari, lit, temp, moist, biome, snow, grazed;
  let buf, bctx, img, data, noise, BW, BH;
  let seed = 0, frame = 0, dirty = true, paused = false;
  let dpr = 1, zoom = 1, minZoom = 1, maxZoom = 10, camX = 0, camY = 0;
  let tool = 'rain', brushR = 3;
  let tod = 0.05, dayCycle = true, dark = 0, warm = 0;
  let windA = Math.random() * Math.PI * 2, windS = 0.8, wx = 1, wy = 0;
  let shake = 0, flash = 0;
  const particles = [], clouds = [], tornados = [], meteors = [], bolts = [], waves = [];
  const lights = [];
  let visFire = 0, visLava = 0, rainCount = 0, vb = { x0: 0, y0: 0, x1: 0, y1: 0 };

  // ================= helpers =================
  function hash(x, y, s) { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453123; return v - Math.floor(v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  const rnd = Math.random;
  function vn(x, y, s) {
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(hash(x0, y0, s), hash(x0 + 1, y0, s), sx), lerp(hash(x0, y0 + 1, s), hash(x0 + 1, y0 + 1, s), sx), sy);
  }
  function fbm(x, y, s, o) {
    let t = 0, f = 1, a = 1, m = 0;
    for (let i = 0; i < o; i++) { t += vn(x * f, y * f, s + i * 17.3) * a; m += a; f *= 2.03; a *= 0.5; }
    return t / m;
  }

  // ================= world =================
  function setupWorld() {
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    W = clamp(Math.round(cw / 4.2), 80, 200);
    H = clamp(Math.round(W * ch / cw), 60, 300);
    N = W * H;
    hgt = new Float32Array(N); cover = new Uint8Array(N); timer = new Int16Array(N);
    wet = new Uint8Array(N); vari = new Float32Array(N); lit = new Uint8Array(N);
    temp = new Float32Array(N); moist = new Float32Array(N); biome = new Uint8Array(N); snow = new Uint16Array(N); grazed = new Uint16Array(N);
    BW = W * SUB; BH = H * SUB;
    buf = document.createElement('canvas'); buf.width = BW; buf.height = BH;
    bctx = buf.getContext('2d');
    img = bctx.createImageData(BW, BH); data = img.data;
    noise = new Uint8Array(BW * BH);
    for (let i = 0; i < noise.length; i++) noise[i] = (rnd() * 256) | 0;
  }

  const isVeg = h => h >= SAND && h < HILL;
  function effTemp(i) { return temp[i] - Math.max(0, hgt[i] - 0.55) * 1.3; }
  function calcBiome(i) {
    const h = hgt[i], t = effTemp(i), m = moist[i];
    if (t < 0.28) return B_TUNDRA;
    if (t > 0.62) { if (m < 0.4) return B_DESERT; if (m < 0.55) return B_SAVANNA; return B_JUNGLE; }
    if (m > 0.66 && h < 0.52) return B_SWAMP;
    return B_TEMP;
  }
  function isCold(i) { return biome[i] === B_TUNDRA || effTemp(i) < 0.33; }
  function setH(i, v) { hgt[i] = clamp(v, 0, 1); biome[i] = calcBiome(i); }

  function generate() {
    seed = rnd() * 1000;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const dx = (x / (W - 1) - 0.5) * 2, dy = (y / (H - 1) - 0.5) * 2;
      let e = fbm(x / 24, y / 24, seed, 6);
      e = 0.5 + (e - 0.5) * 1.8;
      e += (fbm(x / 6.5, y / 6.5, seed + 13, 3) - 0.5) * 0.1;
      e = e + 0.14 - Math.pow(Math.max(Math.abs(dx), Math.abs(dy)), 4) * 0.45 - (dx * dx + dy * dy) * 0.1;
      hgt[i] = clamp(e, 0, 1);
      let t = fbm(x / 36, y / 36, seed + 200, 4);
      t = (0.5 + (t - 0.5) * 1.8) * 0.65 + (y / (H - 1)) * 0.5 - 0.08;
      temp[i] = clamp(t, 0, 1);
      moist[i] = clamp(0.5 + (fbm(x / 22, y / 22, seed + 400, 4) - 0.5) * 1.9, 0, 1);
      cover[i] = C_NONE; timer[i] = 0; wet[i] = 0; snow[i] = 0; grazed[i] = 0; vari[i] = rnd();
    }
    for (let i = 0; i < N; i++) biome[i] = calcBiome(i);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, h = hgt[i], b = biome[i];
      if (h >= SEA && b === B_TUNDRA) snow[i] = 250 + ((rnd() * 300) | 0);
      if (!isVeg(h) || h < SAND + 0.01) continue;
      const f = fbm(x / 10, y / 10, seed + 77, 4);
      let tree = false;
      switch (b) {
        case B_TEMP: tree = (f > 0.53 && rnd() < 0.85) || rnd() < 0.03; break;
        case B_JUNGLE: tree = (f > 0.42 && rnd() < 0.9) || rnd() < 0.08; break;
        case B_SWAMP: tree = f > 0.5 && rnd() < 0.55; break;
        case B_TUNDRA: tree = f > 0.55 && rnd() < 0.7; break;
        case B_SAVANNA: tree = rnd() < 0.06; break;
        case B_DESERT: tree = rnd() < 0.025; break;
      }
      if (tree) cover[i] = C_TREE;
    }
    particles.length = 0; clouds.length = 0; tornados.length = 0; meteors.length = 0; bolts.length = 0; waves.length = 0;
    for (let k = 0; k < 4; k++) spawnAmbientCloud(true);
    populate();
    dirty = true;
  }

  // ================= colours =================
  const P = {
    deep0: [18, 44, 102], deep1: [28, 72, 150], sh0: [36, 96, 182], sh1: [72, 152, 226],
    sand0: [234, 216, 154], sand1: [214, 190, 122], tsand0: [196, 198, 188], tsand1: [176, 178, 170],
    rk0: [132, 128, 122], rk1: [88, 86, 92], sn0: [224, 232, 240], sn1: [255, 255, 255]
  };
  const BIO = [
    { g0: [122, 198, 78], g1: [72, 152, 56], h0: [66, 132, 52], h1: [112, 108, 76] },
    { g0: [204, 220, 210], g1: [162, 184, 172], h0: [150, 170, 160], h1: [140, 142, 146] },
    { g0: [240, 208, 134], g1: [220, 178, 104], h0: [208, 152, 98], h1: [162, 110, 74] },
    { g0: [204, 196, 96], g1: [168, 162, 74], h0: [152, 146, 72], h1: [126, 112, 76] },
    { g0: [74, 182, 64], g1: [40, 132, 46], h0: [36, 114, 44], h1: [82, 98, 62] },
    { g0: [106, 128, 72], g1: [76, 100, 58], h0: [72, 98, 58], h1: [98, 102, 74] }
  ];
  const col = [0, 0, 0];
  function mix(a, b, t) { t = clamp(t, 0, 1); col[0] = lerp(a[0], b[0], t); col[1] = lerp(a[1], b[1], t); col[2] = lerp(a[2], b[2], t); }
  function terrain(h, b) {
    if (h < DEEP) mix(P.deep0, P.deep1, h / DEEP);
    else if (h < SEA) mix(P.sh0, P.sh1, (h - DEEP) / (SEA - DEEP));
    else if (h < SAND) { const t = (h - SEA) / (SAND - SEA); b === B_TUNDRA ? mix(P.tsand0, P.tsand1, t) : mix(P.sand0, P.sand1, t); }
    else if (h < GRASS) mix(BIO[b].g0, BIO[b].g1, (h - SAND) / (GRASS - SAND));
    else if (h < HILL) mix(BIO[b].h0, BIO[b].h1, (h - GRASS) / (HILL - GRASS));
    else if (h < ROCK) mix(P.rk0, P.rk1, (h - HILL) / (ROCK - HILL));
    else mix(P.sn0, P.sn1, (h - ROCK) / 0.1);
  }
  function hAt(x, y) { x = x < 0 ? 0 : x >= W ? W - 1 : x; y = y < 0 ? 0 : y >= H ? H - 1 : y; return hgt[y * W + x]; }

  // ================= sprites (original art) =================
  const SPR = {
    leafy: ['..ll..', '.llmm.', 'llmmmd', 'lmmmdd', '.mmddd', '..dd..', '..tt..', '..tt..'],
    round: ['......', '.lll..', 'llmmm.', 'lmmmmd', '.mmmd.', '..td..', '..t...', '......'],
    pine: ['..l...', '..lm..', '.lmm..', '.lmmd.', 'lmmmd.', 'lmmmdd', '..t...', '..t...'],
    cactus: ['..gl..', '..gl..', 'g.gl..', 'gggl.g', '..glgg', '..gl..', '..gl..', '..gl..'],
    acacia: ['......', '......', 'lllmmm', 'mmmmdd', '.t..t.', '..tt..', '..t...', '..t...'],
    palm: ['.l..l.', 'llmmll', 'm.mm.d', 'm..t.d', '...t..', '..t...', '..t...', '..t...'],
    willow: ['..dd..', '.dmmd.', 'dmmmmd', 'dmddmd', 'd.dd.d', 'd.t..d', '..t...', '..t...']
  };
  const PAL = {
    leafy: { l: [104, 184, 72], m: [52, 128, 52], d: [30, 88, 40], t: [96, 64, 38] },
    pine: { l: [72, 142, 82], m: [36, 100, 58], d: [22, 66, 42], t: [88, 58, 34] },
    tpine: { l: [236, 244, 248], m: [40, 92, 66], d: [26, 62, 46], t: [80, 56, 36] },
    cactus: { g: [64, 148, 72], l: [112, 192, 102] },
    acacia: { l: [150, 170, 70], m: [110, 136, 52], d: [80, 100, 40], t: [100, 72, 44] },
    palm: { l: [124, 212, 84], m: [46, 152, 52], d: [24, 98, 38], t: [110, 78, 44] },
    jungle: { l: [96, 200, 70], m: [34, 128, 44], d: [18, 84, 32], t: [96, 64, 38] },
    willow: { l: [100, 130, 70], m: [74, 104, 56], d: [46, 72, 42], t: [72, 58, 40] }
  };
  for (const k in PAL) PAL[k].snowy = Object.assign({}, PAL[k], { l: [240, 246, 250] });
  const FIRE_SPR = [
    ['...y..', '..yy..', '..yoy.', '.yooy.', '.oyyo.', 'oryyro', 'orrrro', '.rrrr.'],
    ['..y...', '..yy.y', '.yoyy.', '.yooo.', 'oyyyo.', 'oryyro', 'orrrro', '.rrrr.'],
    ['....y.', '.y.yy.', '.yoy..', 'yooy..', 'oyyoo.', 'oryyro', 'orrrro', '.rrrr.']
  ];
  const FIRE_PAL = { y: [255, 238, 120], o: [255, 150, 40], r: [212, 58, 24] };

  function setPx(x, y, c) {
    if (x < 0 || y < 0 || x >= BW || y >= BH) return;
    const q = (y * BW + x) * 4; data[q] = c[0]; data[q + 1] = c[1]; data[q + 2] = c[2];
  }
  function darkenPx(x, y, f) {
    if (x < 0 || y < 0 || x >= BW || y >= BH) return;
    const q = (y * BW + x) * 4; data[q] *= f; data[q + 1] *= f; data[q + 2] *= f;
  }
  function tintPx(x, y, c, t) {
    if (x < 0 || y < 0 || x >= BW || y >= BH) return;
    const q = (y * BW + x) * 4;
    data[q] = lerp(data[q], c[0], t); data[q + 1] = lerp(data[q + 1], c[1], t); data[q + 2] = lerp(data[q + 2], c[2], t);
  }
  function drawSprite(bx, by, spr, pal, flip) {
    for (let ry = 0; ry < spr.length; ry++) {
      const row = spr[ry], w = row.length;
      for (let rx = 0; rx < w; rx++) {
        const ch = row[flip ? w - 1 - rx : rx];
        if (ch !== '.') setPx(bx + rx, by + ry, pal[ch]);
      }
    }
  }
  function drawTree(x, y, i) {
    const b = biome[i], v = vari[i], h = hgt[i];
    let spr, pal;
    if (b === B_DESERT) { spr = SPR.cactus; pal = PAL.cactus; }
    else if (b === B_TUNDRA) { spr = SPR.pine; pal = PAL.tpine; }
    else if (b === B_SAVANNA) { spr = SPR.acacia; pal = PAL.acacia; }
    else if (b === B_JUNGLE) { spr = v < 0.5 ? SPR.palm : SPR.leafy; pal = v < 0.5 ? PAL.palm : PAL.jungle; }
    else if (b === B_SWAMP) { spr = SPR.willow; pal = PAL.willow; }
    else {
      const pine = h > GRASS - 0.03 ? v < 0.8 : v < 0.22;
      spr = pine ? SPR.pine : (v > 0.6 ? SPR.round : SPR.leafy);
      pal = pine ? PAL.pine : PAL.leafy;
    }
    if (snow[i] > 60) pal = pal.snowy;
    const bx = x * SUB, by = y * SUB - 2;
    for (let sy = 5; sy < 8; sy++) for (let sx = 1; sx < 5; sx++) darkenPx(bx + sx + 1, by + sy + 1, 0.72);
    drawSprite(bx, by, spr, pal, v > 0.5);
  }
  const GLOW = [255, 120, 40];
  function drawFire(x, y, i) {
    const bx = x * SUB, by = y * SUB - 2;
    for (let sy = -2; sy < 9; sy++) for (let sx = -3; sx < 9; sx++) tintPx(bx + sx, by + sy, GLOW, 0.18);
    const f = (frame + ((vari[i] * 3) | 0)) % 3;
    drawSprite(bx, by, FIRE_SPR[f], FIRE_PAL, vari[i] > 0.5);
  }
  function drawDeco(x, y, i) {
    const v = vari[i], b = biome[i], bx = x * SUB, by = y * SUB;
    const sx = bx + (((v * 37) | 0) % (SUB - 2)), sy = by + (((v * 91) | 0) % (SUB - 2));
    if (b === B_TEMP && v > 0.95) setPx(sx, sy, v > 0.983 ? [240, 80, 80] : v > 0.967 ? [250, 230, 90] : [245, 245, 245]);
    else if (b === B_DESERT && v > 0.93) { setPx(sx, sy, [150, 130, 110]); setPx(sx + 1, sy, [120, 104, 90]); }
    else if (b === B_SWAMP && v > 0.68) { setPx(sx, sy, [58, 92, 92]); setPx(sx + 1, sy, [58, 92, 92]); setPx(sx, sy + 1, [50, 82, 84]); setPx(sx + 1, sy + 1, [96, 136, 134]); }
    else if (b === B_SAVANNA && v > 0.95) { setPx(sx, sy, [150, 120, 60]); setPx(sx + 1, sy, [130, 100, 50]); }
    else if (b === B_JUNGLE && v > 0.965) setPx(sx, sy, [255, 120, 200]);
  }

  // ================= render to pixel buffer =================
  const FOAM = [196, 230, 250], BURNT = [56, 46, 40], ICE = [206, 235, 248];
  function renderBuffer() {
    lights.length = 0; visFire = 0; visLava = 0;
    vb.x0 = -camX / zoom / SUB; vb.y0 = -camY / zoom / SUB; vb.x1 = (canvas.width - camX) / zoom / SUB; vb.y1 = (canvas.height - camY) / zoom / SUB;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {

            if (cover[j] === C_TREE) { cover[j] = C_FIRE; timer[j] = 30; }
          }

          if (hgt[i] < SEA && rnd() < 0.1) addP('debris', x * SUB + 2, y * SUB + 2, (rnd() - 0.5) * 1.5, -rnd() * 1.5, 20, { c: '#dff2ff', drag: 0.94 });

  // ================= simulation =================
  function igniteNeighbor(j, dx, dy) {
    if (lit[j] || wet[j] > 0 || snow[j] > 40) return;
    const h = hgt[j], c = cover[j];

    const b = biome[j];
    const bf = (b === B_DESERT || b === B_SAVANNA) ? 1.5 : b === B_JUNGLE ? 0.8 : b === B_SWAMP ? 0.4 : b === B_TUNDRA ? 0.6 : 1;
    const wf = Math.max(0.15, 1 + 1.1 * (dx * wx + dy * wy) * windS);
    if (c === C_TREE && rnd() < 0.14 * bf * wf) { cover[j] = C_FIRE; timer[j] = 28 + ((rnd() * 16) | 0); lit[j] = 1; }
    else if (c === C_NONE && rnd() < 0.035 * bf * wf) { cover[j] = C_FIRE; timer[j] = 10 + ((rnd() * 8) | 0); lit[j] = 1; }
  }
  function lavaTick(x, y, i) {
    snow[i] = 0;
    let best = -1, bh = hgt[i] + 0.006;
    const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
    for (const j of nb) {
      if (j < 0) continue;
      if (cover[j] === C_TREE && !lit[j] && rnd() < 0.3) { cover[j] = C_FIRE; timer[j] = 30; lit[j] = 1; }
      if (snow[j] > 0) { snow[j] = 0; if (rnd() < 0.3) steamAt((j % W) * SUB + 2, ((j / W) | 0) * SUB); }
      if (cover[j] !== C_LAVA && hgt[j] < bh) { bh = hgt[j]; best = j; }
    }

    if (best >= 0 && timer[i] > 10 && rnd() < 0.3) {

    }
    if (wet[i] > 0) timer[i] -= 3;
    if (timer[i] <= 0) { cover[i] = C_BASALT; timer[i] = 900; setH(i, hgt[i] + 0.008); }
    if (rnd() < 0.02) emberAt(x * SUB + 2, y * SUB + 1);
  }
  function simulate() {
    lit.fill(0);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, h = hgt[i], c = cover[i], b = biome[i];
      if (wet[i] > 0) wet[i]--;
      if (grazed[i] > 0) grazed[i] = Math.max(0, grazed[i] - (wet[i] ? 3 : 1));
      if (lit[i]) continue;
      if (snow[i] > 0) {
        if (h < SEA) snow[i] = 0;
        else {
          const rate = b === B_TUNDRA ? (snow[i] > 300 ? 1 : 0) : b === B_DESERT ? 5 : (b === B_SAVANNA || b === B_JUNGLE) ? 3 : 1;
          if (rate) { snow[i] = Math.max(0, snow[i] - rate); if (snow[i] === 0) wet[i] = Math.max(wet[i], 40); }
        }
      }
      if (h < SEA) {
        if (c === C_ICE) { if (b !== B_TUNDRA || rnd() < 0.25) timer[i]--; if (timer[i] <= 0) cover[i] = C_NONE; }
        else if (c !== C_NONE) cover[i] = C_NONE;
        continue;
      }
      switch (c) {
        case C_ICE: cover[i] = C_NONE; break;
        case C_FIRE:
          snow[i] = 0;
          if (--timer[i] <= 0) { cover[i] = C_BURNT; timer[i] = 150 + ((rnd() * 200) | 0); }
          else {
            if (x > 0) igniteNeighbor(i - 1, -1, 0);
            if (x < W - 1) igniteNeighbor(i + 1, 1, 0);
            if (y > 0) igniteNeighbor(i - W, 0, -1);
            if (y < H - 1) igniteNeighbor(i + W, 0, 1);
            if (rnd() < 0.05) smokeAt(x * SUB + 2, y * SUB);

        case C_BURNT:

    }
  }

  // ================= camera / canvas =================

      for (const [pts, wmul] of [[b.pts, 1], [b.br, 0.6]]) {
        ctx.beginPath();
        pts.forEach((p, k) => k ? ctx.lineTo(ox + p[0] * z, oy + p[1] * z) : ctx.moveTo(ox + p[0] * z, oy + p[1] * z));
        ctx.strokeStyle = `rgba(160,185,255,${0.5 * a})`; ctx.lineWidth = 3.2 * z * wmul; ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = Math.max(1, 1.1 * z * wmul); ctx.stroke();
      }
    }
    if (flash > 0.01) { ctx.fillStyle = `rgba(235,240,255,${flash})`; ctx.fillRect(0, 0, canvas.width, canvas.height); flash *= 0.8; }

    if (cursor) {
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = Math.max(1, dpr);
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, shotCd(tool) ? 6 * dpr : (brushR + 0.5) * SUB * z, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ================= tools =================
  const ONESHOT = { bolt: 180, meteor: 380, cloud: 700, tornado: 1500, inspect: 250 };
  function shotCd(t) { return ONESHOT[t] || (SPECIES[t] ? 260 : 0); }
  function applyTool(fx, fy) {
    const cx = Math.floor(fx), cy = Math.floor(fy), Rb = brushR;
    for (let dy = -Rb; dy <= Rb; dy++) for (let dx = -Rb; dx <= Rb; dx++) {
      const d = Math.hypot(dx, dy);
      if (d > Rb + 0.3) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const i = y * W + x, h = hgt[i], c = cover[i], fall = 1 - d / (Rb + 1);
      switch (tool) {
        case 'raise': setH(i, h + 0.014 * fall); break;
        case 'lower': setH(i, h - 0.014 * fall); break;
        case 'fire':
          if (isVeg(h) && wet[i] === 0) {
            snow[i] = 0;
            if (c === C_TREE) { cover[i] = C_FIRE; timer[i] = 28 + ((rnd() * 16) | 0); }
            else if (c === C_NONE && rnd() < 0.35) { cover[i] = C_FIRE; timer[i] = 10 + ((rnd() * 8) | 0); }
          }
          break;
        case 'rain':
          if (c === C_FIRE) { cover[i] = C_BURNT; timer[i] = 60 + ((rnd() * 60) | 0); }
          if (c === C_LAVA) { timer[i] -= 4; if (rnd() < 0.1) steamAt(x * SUB + 2, y * SUB); }
          if (h >= SEA) wet[i] = 120;
          if (snow[i] > 0) snow[i] = Math.max(0, snow[i] - 20);
          break;
        case 'snow':
          if (h < SEA) { if (c !== C_ICE) { cover[i] = C_ICE; timer[i] = 350 + ((rnd() * 250) | 0); } }
          else {
            if (c === C_FIRE) { cover[i] = C_BURNT; timer[i] = 60; }
            if (c === C_LAVA) { cover[i] = C_BASALT; timer[i] = 900; steamAt(x * SUB + 2, y * SUB); }
            else snow[i] = Math.min(900, snow[i] + 60 * fall);
          }
          break;
        case 'lava':
          if (rnd() < 0.3 * fall) {
            if (h >= SEA) { cover[i] = C_LAVA; timer[i] = 40 + ((rnd() * 20) | 0); snow[i] = 0; }
            else { setH(i, SEA + 0.012); cover[i] = C_BASALT; timer[i] = 900; steamAt(x * SUB + 2, y * SUB); }
          }
          break;
        case 'tree':
          if (isVeg(h)) {
            if (c === C_BURNT || c === C_BASALT) cover[i] = C_NONE;
            else if (c === C_NONE && rnd() < 0.18) cover[i] = C_TREE;
          }
          break;
        case 'clear': cover[i] = C_NONE; snow[i] = 0; wet[i] = 0; break;
      }
    }
    const spread = () => ({ x: (fx + (rnd() * 2 - 1) * Rb) * SUB, y: (fy + (rnd() * 2 - 1) * Rb) * SUB });
    if (tool === 'rain') for (let k = 0; k < 5; k++) { const s = spread(); rainAt(s.x, s.y); }
    if (tool === 'snow') for (let k = 0; k < 3; k++) { const s = spread(); snowAt(s.x, s.y); }
    if (tool === 'lava') for (let k = 0; k < 2; k++) { const s = spread(); emberAt(s.x, s.y); }
    if (tool === 'fire') { const s = spread(); emberAt(s.x, s.y); if (cool('tfire', 110)) SFX.crackle(0.12); }
    if ((tool === 'raise' || tool === 'lower') && cool('earth', 260)) SFX.rumble();
    if (tool === 'lava' && cool('tlava', 280)) SFX.blup();
    dirty = true;
  }
  function toTile(p) { return { x: (p.x - camX) / zoom / SUB, y: (p.y - camY) / zoom / SUB }; }
  function paintAt(p) { const t = toTile(p); applyTool(t.x, t.y); }
  function shootAt(p) {
    const t = toTile(p);
    if (tool !== 'inspect' && (t.x < 0 || t.y < 0 || t.x >= W || t.y >= H)) return;
    if (tool === 'inspect') { pickAnimal(p); return; }
    if (SPECIES[tool]) spawnFromTool(tool, t.x, t.y);
    else if (tool === 'bolt') strike(t.x, t.y, false);
    else if (tool === 'meteor') launchMeteor(t.x, t.y);
    else if (tool === 'cloud') spawnStorm(t.x, t.y);
    else if (tool === 'tornado') spawnTornado(t.x, t.y);
  }
  function paintLine(a, b) {
    const ta = toTile(a), tb = toTile(b);
    const steps = Math.max(1, Math.ceil(Math.hypot(tb.x - ta.x, tb.y - ta.y) / 1.5));
    for (let s = 1; s <= steps; s++) applyTool(ta.x + (tb.x - ta.x) * s / steps, ta.y + (tb.y - ta.y) * s / steps);
  }

  // ================= input =================
  const ptrs = new Map();
  let mode = 'idle', pinch = null, lastPos = null, panMode = false, painting = false, pendingTimer = null, lastShot = 0;
  function devPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr }; }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  function startPainting(p) {
    painting = true; cursor = p;
    if (shotCd(tool)) { shootAt(p); lastShot = performance.now(); }
    else paintAt(p);
  }

  canvas.addEventListener('pointerdown', e => {
    const p = devPos(e);
    ptrs.set(e.pointerId, p);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    if (ptrs.size === 2) {
      clearTimeout(pendingTimer); painting = false; cursor = null;
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.max(10, dist(a, b)), z: zoom, m: mid(a, b), cx: camX, cy: camY };
      mode = 'pinch';
      return;
    }
    if (ptrs.size > 2) return;
    lastPos = p;
    if (panMode || e.button === 1 || e.button === 2) { mode = 'pan'; return; }
    mode = 'paint';
    if (e.pointerType === 'mouse') startPainting(p);
    else pendingTimer = setTimeout(() => { if (mode === 'paint') startPainting(lastPos); }, 80);
  });
  canvas.addEventListener('pointermove', e => {
    const p = devPos(e);
    if (!ptrs.has(e.pointerId)) { if (e.pointerType === 'mouse') cursor = p; return; }
    ptrs.set(e.pointerId, p);
    if (mode === 'pinch' && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const m = mid(a, b);
      const nz = clamp(pinch.z * dist(a, b) / pinch.d, minZoom, maxZoom);
      const wx0 = (pinch.m.x - pinch.cx) / pinch.z, wy0 = (pinch.m.y - pinch.cy) / pinch.z;
      zoom = nz; camX = m.x - wx0 * zoom; camY = m.y - wy0 * zoom; clampCam();
    } else if (mode === 'pan') {
      camX += p.x - lastPos.x; camY += p.y - lastPos.y; lastPos = p; clampCam();
    } else if (mode === 'paint') {
      if (painting) { if (!shotCd(tool)) paintLine(lastPos, p); cursor = p; }
      lastPos = p;
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {
      clearTimeout(pendingTimer);
      mode = 'idle'; painting = false;
      if (e.pointerType !== 'mouse') cursor = null;
    } else if (mode === 'pinch') mode = 'idle';
  }
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !ptrs.size) cursor = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const p = devPos(e);
    zoomAt(p.x, p.y, zoom * Math.pow(1.0015, -e.deltaY));
  }, { passive: false });

  // ================= UI: tabs & pixel icons =================
  const ICONS = {
    tabLand: { rows: ['........', '....w...', '...wsw..', '..wssss.', '.gssssss', 'ggsssggg', 'gggggggg', '........'], pal: { w: '#eef3f7', s: '#8a8a90', g: '#5cb84a' } },
    fire: { rows: ['...y....', '..yy..y.', '..yoy.y.', '.yoooyy.', '.oorooy.', 'yorrroo.', '.orrro..', '..ooo...'], pal: { y: '#ffe45c', o: '#ff8a1e', r: '#d8361c' } },
    rain: { rows: ['...b....', '...b....', '..bbb...', '.bbbbb..', '.blbbb..', '.bbbbb..', '..bbb...', '........'], pal: { b: '#4aa8ff', l: '#cfe9ff' } },
    snow: { rows: ['...w....', '.w.w.w..', '..www...', 'wwwcwww.', '..www...', '.w.w.w..', '...w....', '........'], pal: { w: '#dff4ff', c: '#7fd0ff' } },
    cloud: { rows: ['...gg...', '.gglgg..', 'glllllgg', 'gggggggg', '.dddddd.', '..y..b..', '.y..b...', '........'], pal: { g: '#aab4bf', l: '#e6ebf0', d: '#6b7480', y: '#ffe45c', b: '#5ab0ff' } },
    bolt: { rows: ['....yy..', '...yy...', '..yy....', '.yyyyy..', '...yy...', '..yy....', '.yy.....', '.y......'], pal: { y: '#ffe45c' } },
    tornado: { rows: ['wwwwwwww', '.gwwwwg.', '..wwww..', '..gwwg..', '...ww...', '...gw...', '....w...', '...gg...'], pal: { w: '#e4e8ec', g: '#9aa4ae' } },
    lava: { rows: ['........', '...rr...', '..royr..', '.rooyor.', 'roooyoor', 'rroooorr', 'ddrrrrdd', 'dddddddd'], pal: { r: '#d8361c', o: '#ff8a1e', y: '#ffe45c', d: '#3a2a26' } },
    meteor: { rows: ['y.......', '.o......', '..oo....', '...orr..', '...rddd.', '....dgdd', '....dddd', '.....dd.'], pal: { y: '#ffe45c', o: '#ff8a1e', r: '#d8361c', d: '#5a4a44', g: '#8a7a70' } },
    lower: { rows: ['...r....', '...r....', '.rrrrr..', '..rrr...', '...r....', '........', 'bbbbbbbb', 'lblbblbb'], pal: { r: '#ff5a3c', b: '#2e74d0', l: '#7fc0ff' } },
    raise: { rows: ['...g....', '..ggg...', '.ggggg..', '...g....', '...w....', '..wss...', '.wssss..', 'wsssssss'], pal: { g: '#7cff5a', w: '#eef3f7', s: '#8a8a90' } },
    tree: { rows: ['..lll...', '.lmmml..', 'lmmmmmd.', 'lmmmmdd.', '.mmmdd..', '...t....', '...t....', '..ttt...'], pal: { l: '#7cd35a', m: '#3e9a3e', d: '#22662e', t: '#7a4e2a' } },
    inspect: { rows: ['.www....', 'w...w...', 'w...w...', 'w...w...', '.www....', '....bb..', '.....bb.', '......bb'], pal: { w: '#e8f0ff', b: '#c8a060' } },
    clear: { rows: ['r......r', '.r....r.', '..r..r..', '...rr...', '...rr...', '..r..r..', '.r....r.', 'r......r'], pal: { r: '#ff5a3c' } }
  };
  const TABS = [
    { id: 'land', label: 'Земля', icon: 'tabLand', tools: [['raise', 'Вище'], ['lower', 'Нижче'], ['tree', 'Ліс'], ['clear', 'Чисто']] },
    { id: 'weather', label: 'Погода', icon: 'cloud', tools: [['rain', 'Дощ'], ['snow', 'Сніг'], ['cloud', 'Хмара'], ['bolt', 'Грім'], ['tornado', 'Смерч']] },
    { id: 'chaos', label: 'Лихо', icon: 'meteor', tools: [['fire', 'Вогонь'], ['lava', 'Лава'], ['meteor', 'Метеор']] },
    { id: 'herb', label: 'Травоїдні', icon: 'cow', tools: [['inspect', 'Огляд'], ['cow', 'Корова'], ['sheep', 'Вівця'], ['chicken', 'Курка'], ['rabbit', 'Заєць'], ['deer', 'Олень'], ['zebra', 'Зебра'], ['elephant', 'Слон'], ['camel', 'Верблюд'], ['penguin', 'Пінгвін'], ['frog', 'Жаба']] },
    { id: 'pred', label: 'Хижаки', icon: 'wolf', tools: [['inspect', 'Огляд'], ['wolf', 'Вовк'], ['fox', 'Лисиця'], ['bear', 'Ведмідь'], ['polar', 'Полярний'], ['lion', 'Лев'], ['tiger', 'Тигр'], ['croc', 'Крокодил']] },
    { id: 'sea', label: 'Море', icon: 'whale', tools: [['inspect', 'Огляд'], ['fish', 'Риби'], ['whale', 'Кит'], ['shark', 'Акула'], ['dolphin', 'Дельфін'], ['crab', 'Краб']] },
    { id: 'sky', label: 'Небо', icon: 'bird', tools: [['inspect', 'Огляд'], ['bird', 'Птахи'], ['gull', 'Чайки'], ['eagle', 'Орел'], ['bat', 'Кажани'], ['butterfly', 'Метелик']] }
  ];
  const HINTS = {
    raise: 'Тримай — земля росте', lower: 'Тримай — копай і топи', tree: 'Саджай ліс', clear: 'Прибирає все з землі',
    rain: 'Гасить вогонь і поливає землю', snow: 'Сніг на землі, лід на воді', cloud: 'Гроза: дощ, сніг і блискавки',
    bolt: 'Торкнись — удар блискавки', tornado: 'Смерч вириває дерева', fire: 'Підпали — вітер рознесе вогонь',
    lava: 'Лава тече вниз, у воді застигає', meteor: 'Торкнись — метеорит', inspect: 'Торкнись звіра — побачиш, що він робить'
  };
  function iconCanvas(ic) {
    const c = document.createElement('canvas'); c.width = 8; c.height = 8;
    const g = c.getContext('2d');
    ic.rows.forEach((row, y) => { for (let x = 0; x < 8; x++) { const ch = row[x]; if (ch && ch !== '.') { g.fillStyle = ic.pal[ch]; g.fillRect(x, y, 1, 1); } } });
    return c;
  }
  let toastTimer = null;
  function showToast(text, ms) {
    toastEl.textContent = text; toastEl.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, ms);
  }
  const tabsEl = document.getElementById('tabs'), toolbar = document.getElementById('toolbar');
  let tab = 'weather';
  function buildTabs() {
    tabsEl.innerHTML = '';
    TABS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab' + (t.id === tab ? ' active' : '');
      b.appendChild(ICONS[t.icon] ? iconCanvas(ICONS[t.icon]) : spriteIcon(t.icon));
      b.title = t.label; b.setAttribute('aria-label', t.label);
      b.addEventListener('click', () => { tab = t.id; buildTabs(); buildTools(); showToast(t.label, 1000); });
      tabsEl.appendChild(b);
    });
  }
  function buildTools() {
    toolbar.innerHTML = '';
    TABS.find(t => t.id === tab).tools.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'tool' + (id === tool ? ' active' : '');
      b.appendChild(ICONS[id] ? iconCanvas(ICONS[id]) : spriteIcon(id));
      const s = document.createElement('span'); s.textContent = label; b.appendChild(s);
      b.addEventListener('click', () => {
        tool = id;
        if (id !== 'inspect') { selected = null; updateInspect(); }
        if (panMode) { panMode = false; panBtn.classList.remove('on'); }
        buildTools();
        showToast(HINTS[id] || ('Торкнись карти: ' + label.toLowerCase()), 1800);
        SFX.click();
      });
      toolbar.appendChild(b);
    });
  }
  buildTabs(); buildTools();

  const panBtn = document.getElementById('panBtn');
  panBtn.addEventListener('click', () => { panMode = !panMode; panBtn.classList.toggle('on', panMode); });
  const brushBtn = document.getElementById('brushBtn');
  const SIZES = [[2, 'S'], [3, 'M'], [5, 'L']];
  brushBtn.addEventListener('click', () => {
    const k = (SIZES.findIndex(s => s[0] === brushR) + 1) % SIZES.length;
    brushR = SIZES[k][0]; brushBtn.textContent = SIZES[k][1];
  });
  const dayBtn = document.getElementById('dayBtn');
  dayBtn.addEventListener('click', () => { dayCycle = !dayCycle; dayBtn.classList.toggle('on', dayCycle); });
  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? '▶' : '❚❚'; pauseBtn.classList.toggle('on', paused); });
  document.getElementById('regenBtn').addEventListener('click', () => { generate(); fitCamera(); zoomAt(canvas.width / 2, canvas.height / 2, zoom * 1.5); });
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    initAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if (master) master.gain.setTargetAtTime(soundOn ? 0.7 : 0, AC.currentTime, 0.05);
  });
  window.addEventListener('pointerdown', initAudio, true);

  // ================= loop =================
  let lastTick = 0, lastHold = 0, lastTs = 0;
  function loop(ts) {
    const dt = Math.min(100, ts - (lastTs || ts)); lastTs = ts;
    if (!paused) {
      if (ts - lastTick > TICK) {
        lastTick = ts;
        windA += (rnd() - 0.5) * 0.06;
        windS = 0.65 + 0.35 * Math.sin(ts / 23000);
        wx = Math.cos(windA); wy = Math.sin(windA);
        simulate(); weatherTick();
        frame++; dirty = true;
      }
      if (dayCycle) tod = (tod + dt / 150000) % 1;
      updateClouds(); updateEntities(); updateAnimals(); updateParticles();
    }
    if (dayCycle) {
      const sun = Math.cos(tod * Math.PI * 2);
      dark = clamp((-0.2 - sun) * 0.9, 0, 0.62);
      warm = clamp(1 - Math.abs(sun + 0.1) * 3.5, 0, 1) * 0.3;
    } else { dark = 0; warm = 0; }
    if (painting && mode === 'paint') {
      if (shotCd(tool)) { if (ts - lastShot > shotCd(tool)) { lastShot = ts; shootAt(lastPos); } }
      else if (ts - lastHold > 70) { lastHold = ts; paintAt(lastPos); }
    }
    if (dirty) { renderBuffer(); dirty = false; }
    render();
    if (AC) { if (fc % 6 === 0) audioTick(ts); ambientSfx(); animalVoices(); }
    if ((frame & 3) === 0) {
      const mins = Math.floor(((12 + tod * 24) % 24) * 60);
      timeLbl.textContent = (dark > 0.25 ? '☾ ' : '☀ ') + String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
      windArrow.style.transform = `rotate(${windA}rad)`;
      let na = 0; for (const a of animals) if (a.S.key !== 'firefly') na++;
      animalLbl.textContent = '🐾 ' + na;
      updateInspect();
    }
    requestAnimationFrame(loop);
  }

  sizeCanvas();
  setupWorld();
  generate();
  fitCamera(); zoomAt(canvas.width / 2, canvas.height / 2, zoom * 1.5);
  window.addEventListener('resize', () => { sizeCanvas(); clampCam(); if (zoom < minZoom) fitCamera(); });
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  showToast(coarse ? 'Два пальці — масштаб і рух' : 'Колесо — масштаб, права кнопка — рух', 4000);
  requestAnimationFrame(loop);
})();
</script>
